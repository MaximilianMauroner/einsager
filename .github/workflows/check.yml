name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Draft conversion must enter the same group to cancel an older desktop matrix.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks (draft)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          save-if: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --check
      - run: cargo test --locked -j 1
      - run: cargo clippy --locked -j 1 --all-targets -- -D warnings

  desktop:
    name: Desktop (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
            pnpm-workspace.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The action also keys by rustc version/host, Cargo manifests/locks and config.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --check
      - run: cargo test --locked -j 1
      - run: cargo clippy --locked -j 1 --all-targets -- -D warnings
      - run: pnpm build
      - run: pnpm package
      - name: Linux input test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xdotool
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        # One X server for all three. With one xvfb-run each, the packaged app, always started second, sometimes
        # got no window (runs 38530716881 and 38534121008). The cause is not proven; one server removes that difference.
        run: xvfb-run -a sh -c 'pnpm test:desktop && pnpm test:packaged && pnpm test:linux'
      - name: Desktop smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          pnpm test:desktop
          pnpm test:packaged
      - name: macOS shortcut tests and app signature
        if: runner.os == 'macOS'
        run: |
          pnpm test:macos
          codesign --verify --deep --strict release/einsager-darwin-*/einsager.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: .agents/artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
