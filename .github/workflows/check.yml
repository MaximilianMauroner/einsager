name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --check
      - run: cargo test --locked -j 1
      - run: cargo clippy --locked -j 1 --all-targets -- -D warnings
      - run: pnpm build
      - run: pnpm package
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pnpm test:desktop
          xvfb-run -a pnpm test:packaged
      - name: Desktop smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          pnpm test:desktop
          pnpm test:packaged
      - name: Native Mac checks and build
        if: runner.os == 'macOS'
        run: |
          zsh scripts/check.sh
          zsh build.sh
          plutil -lint dist/einsager.app/Contents/Info.plist
          codesign --verify --deep --strict dist/einsager.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: .agents/artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
