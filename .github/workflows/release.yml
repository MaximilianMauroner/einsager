name: Release

# Pushing a version tag such as v0.1.0 builds the app on each OS and drafts a GitHub release.
# Publish the draft by hand after checking its notes and downloads.
# Run it by hand with an existing tag to add the archives that its release lacks. It never replaces an archive.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# A tag push and a manual run for the same tag must not upload at the same time.
concurrency: release-${{ inputs.tag || github.ref_name }}

jobs:
  version:
    name: Tag matches the app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - run: |
          version="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -qx "version = \"$version\"" crates/transcription/Cargo.toml

  package:
    name: Package (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package
      - name: Packaged app smoke test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm test:packaged
      - name: Archive
        run: |
          version="${TAG#v}"
          arch="$(node -p process.arch)"
          folder="einsager-$(node -p process.platform)-$arch"
          cd release
          case "$RUNNER_OS" in
            Linux) chmod 755 "$folder" && tar -czf "einsager-$version-linux-$arch.tar.gz" "$folder" ;;
            macOS) ditto -c -k --keepParent "$folder/einsager.app" "einsager-$version-macos-$arch.zip" ;;
            Windows) 7z a -bd "einsager-$version-windows-$arch.zip" "$folder" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: einsager-${{ runner.os }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release or add missing archives
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the draft, or add the missing archives
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            sha256sum einsager-* > SHA256SUMS.txt
            gh release create "$TAG" einsager-* SHA256SUMS.txt --draft --verify-tag --title "einsager $TAG" --generate-notes
            exit 0
          fi
          # The release exists, for example after a rerun or for a tag that had only some systems.
          # Keep its archives, upload the others, and list the checksums of all published archives.
          # Upload without --clobber never replaces an archive.
          mkdir published
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -q '^einsager-' <<< "$names"; then
            gh release download "$TAG" --pattern 'einsager-*' --dir published
          fi
          missing=()
          for file in einsager-*; do
            if [ ! -e "published/$file" ]; then missing+=("$file"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${missing[@]}"
            cp "${missing[@]}" published/
          fi
          (cd published && sha256sum einsager-*) > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
